name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e .[dev]
      - name: Tests
        run: pytest

  quality:
    # Линт, типы, аудит и порог покрытия детерминированы — гоняем один раз,
    # а не на каждой из ячеек матрицы test.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: pip install -e .[dev]
      - name: Security audit
        # Аудитим дерево зависимостей проекта, а не весь venv: иначе CVE в
        # pip/setuptools самого раннера красит зелёный main без коммита.
        run: pip-audit .
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy
      - name: Coverage gate
        run: pytest --cov=wheelsparser --cov-report=term --cov-fail-under=80
