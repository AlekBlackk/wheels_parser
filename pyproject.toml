[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wheelsparser"
version = "2.0.0"
description = "Мониторинг Telegram-каналов и Twitch-чатов на ссылки BetBoom (колёса фрибетов)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.32,<3",
    "beautifulsoup4>=4.12,<5",
    "python-dotenv>=1.0,<2",
    "colorama>=0.4.6,<0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-requests",
    "types-colorama",
]

[project.scripts]
wheelsparser = "wheelsparser.app:main"

[tool.setuptools]
packages = ["wheelsparser"]

[tool.setuptools.package-data]
wheelsparser = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "RUF", # ruff-specific
]
ignore = [
    # Кириллица в строках/докстрингах/комментариях — не «опечатки»:
    # проект на русском языке.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.mypy]
python_version = "3.10"
packages = ["wheelsparser"]
check_untyped_defs = true
warn_unused_ignores = true
